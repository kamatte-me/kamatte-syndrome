name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - id: content-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.CONTENT_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_REPO_APP_PRIVATE_KEY }}
          owner: kamatte-me
          repositories: kamatte-syndrome-content
          permission-contents: read
      - uses: actions/checkout@v7.0.1
        with:
          repository: kamatte-me/kamatte-syndrome-content
          ref: main
          path: apps/web/kamatte-syndrome-content
          token: ${{ steps.content-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
      - run: pnpm install
      - run: pnpm build
      - name: Verify GitHub Action bundles
        run: |
          changes="$(git status --porcelain --untracked-files=all -- .github/actions/*/dist)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm lint:ci
