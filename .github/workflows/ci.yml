name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - id: content-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CONTENT_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_REPO_APP_PRIVATE_KEY }}
          owner: kamatte-me
          repositories: kamatte-syndrome-content
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: kamatte-me/kamatte-syndrome-content
          ref: main
          path: apps/web/kamatte-syndrome-content
          token: ${{ steps.content-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
      - run: pnpm install
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint:ci
