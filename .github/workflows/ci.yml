name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    outputs:
      action_bundles_changed: ${{ steps.verify-action-bundles.outputs.changed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - id: content-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.CONTENT_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_REPO_APP_PRIVATE_KEY }}
          owner: kamatte-me
          repositories: kamatte-syndrome-content
          permission-contents: read
      - uses: actions/checkout@v7.0.1
        with:
          repository: kamatte-me/kamatte-syndrome-content
          ref: main
          path: apps/web/kamatte-syndrome-content
          token: ${{ steps.content-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
      - run: pnpm install
      - name: Restore Turborepo cache
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: turborepo-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turborepo-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Restore image optimization cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            apps/web/node_modules/.cache/vite-plugin-react-optimized-responsive-image
            apps/web/node_modules/.cache/vite-plugin-optimized-social-image
          key: image-optimization-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/vite.config.ts', 'packages/image-optimization-core/src/**', 'packages/vite-plugin-react-optimized-responsive-image/src/**', 'packages/vite-plugin-optimized-social-image/src/**', 'apps/web/kamatte-syndrome-content/media/**') }}
          restore-keys: |
            image-optimization-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - id: verify-action-bundles
        name: Verify GitHub Action bundles
        run: |
          changes="$(git status --porcelain --untracked-files=all -- .github/actions/*/dist)"
          if [ -n "$changes" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' "$changes"
            exit 1
          fi
          echo 'changed=false' >> "$GITHUB_OUTPUT"
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint:ci

  update-action-bundles:
    name: Update GitHub Action bundles
    needs: checks
    if: >-
      !cancelled() &&
      needs.checks.outputs.action_bundles_changed == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './.github/actions/*' build

      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.KAMATTE_SYNDROME_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KAMATTE_SYNDROME_BOT_APP_PRIVATE_KEY }}

      - name: Commit regenerated bundles
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.email 'kamatte-syndrome-bot@users.noreply.github.com'
          git config user.name 'kamatte-syndrome-bot[bot]'
          git add .github/actions/*/dist
          git -c core.hooksPath=/dev/null commit -m 'chore(actions): rebuild bundles'
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${PR_HEAD_REF}"
