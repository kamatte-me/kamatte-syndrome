name: Update GitHub Action bundles

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: read
  issues: write

concurrency:
  group: update-action-bundles-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event.label.name == 'update-action-bundles' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './.github/actions/*' build

      - id: changes
        name: Detect regenerated bundles
        run: |
          changes="$(git status --porcelain --untracked-files=all -- .github/actions/*/dist)"
          if [ -z "$changes" ]; then
            echo 'has-changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'has-changes=true' >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.has-changes == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.KAMATTE_SYNDROME_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.KAMATTE_SYNDROME_BOT_APP_PRIVATE_KEY }}

      - if: steps.changes.outputs.has-changes == 'true'
        name: Commit regenerated bundles
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.email 'kamatte-syndrome-bot@users.noreply.github.com'
          git config user.name 'kamatte-syndrome-bot[bot]'
          git add .github/actions/*/dist
          git -c core.hooksPath=/dev/null commit -m 'chore(actions): rebuild bundles'
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${PR_HEAD_REF}"

      - name: Remove trigger label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label update-action-bundles
