name: Post to X
description: Post one text message to X.
inputs:
  text:
    description: Text to publish.
    required: true
  consumer-key:
    description: X OAuth 1.0a consumer key.
    required: true
  consumer-secret:
    description: X OAuth 1.0a consumer secret.
    required: true
  access-token:
    description: X access token.
    required: true
  access-token-secret:
    description: X access token secret.
    required: true
runs:
  using: node24
  main: dist/index.js
